<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Upload 📸</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f6f6f6;
      margin: 0;
      padding: 0;
    }
    .wrap {
      max-width: 520px;
      margin: 40px auto;
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 8px; }
    p { margin: 0 0 18px; color: #444; }
    .box {
      border: 2px dashed #ddd;
      border-radius: 12px;
      padding: 18px;
      background: #fafafa;
      margin: 14px 0 18px;
    }
    input[type="file"] { width: 100%; }
    button {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { background: #888; cursor: not-allowed; }
    .status { margin-top: 14px; font-weight: 600; }
    .hint { margin-top: 8px; color: #666; font-size: 14px; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Share your photos 📸</h1>
    <p>Upload straight from your phone.</p>

    <div class="box">
      <input id="photos" type="file" accept="image/*,video/*" multiple />
      <div class="hint">Tip: you can select multiple photos or videos at once.</div>
    </div>

    <button id="uploadBtn">Upload</button>

    <div class="status" id="status"></div>

<table id="uploadTable" style="width:100%; margin-top:16px; border-collapse:collapse;">
  <thead>
    <tr style="text-align:left;">
      <th style="padding:8px 0; border-bottom:1px solid #eee;">File</th>
      <th style="padding:8px 0; border-bottom:1px solid #eee;">Progress</th>
      <th style="padding:8px 0; border-bottom:1px solid #eee;">Status</th>
    </tr>
  </thead>
  <tbody id="uploadTbody"></tbody>
</table>
  </div>

  <!-- IMPORTANT: absolute path so it works from /photo-upload/ -->
  <script src="/photo-upload/upload.js"></script>
</body>
</html>
