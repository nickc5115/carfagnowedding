<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Upload 📸</title>

  <style>
    :root {
      --dusty-blue: #7a8fa6;
      --dusty-blue-dark: #5e728b;
      --gold: #c9a35a;
      --gold-soft: #f3e6c8;
      --ink: #2b2f38;
      --paper: #fff;
      --bg: #f3f5f8;
    }
    body {
      font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: radial-gradient(1200px 400px at 50% -100px, #e7ecf3, var(--bg));
      color: var(--ink);
      margin: 0;
      padding: 0;
    }
    .wrap {
      max-width: 520px;
      margin: 40px auto;
      background: var(--paper);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 18px 40px rgba(33, 46, 63, 0.12);
      border: 1px solid rgba(122, 143, 166, 0.18);
      position: relative;
      overflow: hidden;
    }
    .wrap::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--dusty-blue), var(--gold));
    }
    h1 { margin: 8px 0 6px; font-size: 26px; letter-spacing: 0.2px; }
    p { margin: 0 0 18px; color: #4b5563; }
    .subtitle {
      color: var(--dusty-blue-dark);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .box {
      border: 2px dashed rgba(122, 143, 166, 0.45);
      border-radius: 14px;
      padding: 18px;
      background: linear-gradient(180deg, #fafbfc, #f6f8fb);
      margin: 14px 0 18px;
    }
    input[type="file"] { width: 100%; }
    button {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--dusty-blue), var(--dusty-blue-dark));
      color: #fff;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(94, 114, 139, 0.24);
    }
    button:hover { filter: brightness(1.03); }
    button:disabled { background: #9aa8b9; cursor: not-allowed; box-shadow: none; }
    .status { margin-top: 14px; font-weight: 600; color: var(--dusty-blue-dark); }
    .hint { margin-top: 8px; color: #6b7280; font-size: 14px; }
    table { width: 100%; margin-top: 16px; border-collapse: collapse; table-layout: fixed; }
    thead th {
      padding: 8px 6px;
      border-bottom: 1px solid rgba(201, 163, 90, 0.35);
      color: var(--dusty-blue-dark);
      font-weight: 600;
    }
    tbody td { padding: 10px 6px; vertical-align: middle; }
    th.col-file { width: 58%; }
    th.col-progress { width: 24%; }
    th.col-status { width: 18%; }
    .statusCell { text-align: right; white-space: nowrap; }
    tbody tr:last-child { border-bottom: none; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="subtitle">Wedding Photo Drop</div>
    <h1>Share your photos 📸</h1>
    <p>Thank you for celebrating with us — add your favorite moments.</p>

    <div class="box">
      <input id="photos" type="file" accept="image/*" multiple />
      <div class="hint">Tip: you can select multiple photos at once.</div>
    </div>

    <button id="uploadBtn">Upload</button>

    <div class="status" id="status"></div>

<table id="uploadTable">
  <thead>
    <tr style="text-align:left;">
      <th class="col-file">File</th>
      <th class="col-progress">Progress</th>
      <th class="col-status">Status</th>
    </tr>
  </thead>
  <tbody id="uploadTbody"></tbody>
</table>
  </div>

  <!-- IMPORTANT: absolute path so it works from /photo-upload/ -->
  <script src="/photo-upload/upload.js"></script>
</body>
</html>
